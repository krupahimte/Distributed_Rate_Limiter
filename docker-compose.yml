# Two app instances behind nginx, sharing one Redis, to demonstrate distributed rate limiting.
#   docker compose up --build
#   curl -i -H "X-User-Id: alice" "http://localhost:8080/api/search?q=redis"
# Pick the algorithm with RATE_LIMITER_ALGORITHM=token-bucket | sliding-window-log | sliding-window-counter

x-app: &app
  build: .
  image: distributed-rate-limiter:local
  environment: &app-env
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    RATE_LIMITER_ALGORITHM: ${RATE_LIMITER_ALGORITHM:-token-bucket}
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    <<: *app
    environment:
      <<: *app-env
      APP_INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      APP_INSTANCE_ID: app2

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped
