name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum the project targets; 21 matches the Docker runtime image
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Unit tests, Testcontainers integration tests (Docker is available on ubuntu runners),
      # the 1000-request concurrency test, and the JaCoCo coverage gate
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: matrix.java == 21
        run: bash scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (type-check, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images & smoke tests
    needs: [build-and-test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            distributed-rate-limiter:local
            distributed-rate-limiter:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          push: false
          tags: |
            rate-limiter-playground:local
            rate-limiter-playground:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start the stack (2 API instances, nginx, Redis, frontend)
        run: docker compose up -d --no-build --wait

      - name: Smoke test shared rate limit
        run: bash scripts/smoke-test.sh

      - name: Smoke test frontend
        run: bash scripts/smoke-test-frontend.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down
