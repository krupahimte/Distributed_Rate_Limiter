name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum the project targets; 21 matches the Docker runtime image
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Unit tests, Testcontainers integration tests (Docker is available on ubuntu runners),
      # the 1000-request concurrency test, and the JaCoCo coverage gate
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: matrix.java == 21
        run: bash scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image & smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            distributed-rate-limiter:local
            distributed-rate-limiter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start two instances behind nginx
        run: docker compose up -d --no-build --wait redis app1 app2 nginx

      - name: Smoke test shared rate limit
        run: bash scripts/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down
