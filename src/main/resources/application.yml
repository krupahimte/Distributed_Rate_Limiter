spring:
  application:
    name: distributed-rate-limiter
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      # Keep short so a Redis outage triggers fail-open/closed quickly (Lettuce default is 10s)
      connect-timeout: 500ms

rate-limiter:
  enabled: true
  # token-bucket | sliding-window-log | sliding-window-counter
  algorithm: ${RATE_LIMITER_ALGORITHM:token-bucket}
  # Allow requests when Redis is unavailable (true) or reject them (false)
  fail-open: true
  key-prefix: rate_limit

server:
  port: ${SERVER_PORT:8080}
  # Use Tomcat's RemoteIpValve: X-Forwarded-For is trusted only from internal proxies
  # (10/8, 172.16/12, 192.168/16, loopback), e.g. nginx on the Docker network.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
