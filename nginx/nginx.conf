events {}

http {
    # Round-robin across both instances; the shared Redis keeps their limits consistent
    upstream rate_limiter {
        server app1:8080;
        server app2:8080;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rate_limiter;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # nginx is the edge proxy: overwrite (not append to) any X-Forwarded-For the client
            # sent, so clients cannot choose the IP they are rate limited by
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Shows which instance answered (handy for the demo)
            add_header X-Upstream $upstream_addr always;
        }
    }
}
